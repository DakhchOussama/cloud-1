services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: on-failure
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - my_mariadb:/var/lib/mysql
    networks:
      - inceptionNet
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$DB_ROOT_PASSWORD mysqladmin ping -h localhost -uroot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: on-failure
    env_file:
      - .env
    volumes:
      - my_wordpress:/var/www/html
    networks:
      - inceptionNet
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm82 -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - my_wordpress:/var/www/html
    networks:
      - inceptionNet
    depends_on:
      wordpress:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: on-failure
    env_file:
      - .env
    environment:
      - PMA_HOST=mariadb
      - PMA_PORT=3306
    ports:
      - "8080:80"
    networks:
      - inceptionNet
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  my_mariadb:
    driver: local
  my_wordpress:
    driver: local

networks:
  inceptionNet:
    driver: bridge